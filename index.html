<style>
  :root {
    --ink: #1B1F28;
    --surface: #242A38;
    --surface-raised: #2C3444;
    --paper: #EDEAE2;
    --paper-dim: #B9B6AC;
    --seal: #C1443B;
    --teal: #6E9887;
    --amber: #C99A3E;
    --line: rgba(237,234,226,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Sans Hebrew', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 24px; }
  .brand span { color: var(--paper-dim); font-family: 'Noto Sans Hebrew', sans-serif; font-size: 13px; display: block; font-weight: 400; }
  .seal {
    width: 44px; height: 44px; border: 2px solid var(--seal); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Shippori Mincho', serif; color: var(--seal); font-size: 18px; font-weight: 700;
    flex-shrink: 0; transform: rotate(2deg);
  }

  .topnav { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .back-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--paper);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
  }
  .topnav h1 { font-size: 17px; font-weight: 700; margin: 0; font-family: 'Shippori Mincho', serif; }
  .topnav .sub { font-size: 12px; color: var(--paper-dim); margin: 2px 0 0; }

  /* category grid */
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 6px; }
  .cat-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 12px; text-align: center; cursor: pointer;
  }
  .cat-card .icon { font-size: 26px; margin-bottom: 8px; }
  .cat-card .name { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .cat-card .prog { font-size: 11px; color: var(--paper-dim); margin-top: 6px; }

  .stack-pill {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid rgba(193,68,59,0.4); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px; cursor: pointer;
  }
  .stack-pill .txt { font-size: 14px; font-weight: 700; }
  .stack-pill .count { font-family: 'Shippori Mincho', serif; color: var(--seal); font-size: 20px; font-weight: 700; }

  /* subcategory list */
  .sub-list { display: flex; flex-direction: column; gap: 8px; }
  .sub-row {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .sub-row .name { font-size: 14.5px; font-weight: 700; }
  .sub-row .prog { font-size: 12px; color: var(--paper-dim); margin-top: 3px; }
  .sub-row .chev { color: var(--paper-dim); font-size: 16px; }

  /* word cards */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 10px; min-height: 84px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent; position: relative; gap: 6px;
  }
  .card.known { border-color: rgba(110,152,135,0.5); }
  .card.unknown { border-color: rgba(193,68,59,0.55); }
  .card .front-en { font-size: 13px; }
  .card .back-ro { font-family: 'Shippori Mincho', serif; font-size: 15.5px; font-weight: 700; color: var(--teal); display: none; }
  .card.flipped .front-en { display: none; }
  .card.flipped .back-ro { display: block; }
  .mark-row { display: none; gap: 6px; margin-top: 2px; }
  .card.flipped .mark-row { display: flex; }
  .mark-btn { font-size: 15px; border: none; border-radius: 6px; width: 28px; height: 24px; cursor: pointer; background: var(--surface-raised); color: var(--paper); }
  .mark-btn.active-know { background: var(--teal); color: #10231C; }
  .mark-btn.active-unknown { background: var(--seal); color: #2B0E0C; }
  .status-dot { position: absolute; top: 6px; left: 8px; width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.known { background: var(--teal); }
  .status-dot.unknown { background: var(--seal); }

  .empty-note {
    color: var(--paper-dim); font-size: 13px; background: var(--surface); border: 1px dashed var(--line);
    border-radius: 10px; padding: 16px; text-align: center; line-height: 1.6;
  }

  .game-btn {
    width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; border: 1px solid var(--teal);
    background: transparent; color: var(--teal); font-family: 'Noto Sans Hebrew', sans-serif;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .game-btn:disabled { border-color: var(--line); color: var(--paper-dim); cursor: default; }
  .game-btn:active:not(:disabled) { background: rgba(110,152,135,0.12); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,12,16,0.9); z-index: 50;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .game-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; text-align: center; position: relative; }
  .game-close { position: absolute; top: 14px; left: 14px; background: none; border: none; color: var(--paper-dim); font-size: 18px; cursor: pointer; }
  .game-progress { font-size: 12px; color: var(--paper-dim); margin-bottom: 18px; }
  .game-word { font-size: 22px; margin: 20px 0 8px; }
  .game-reading { font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 700; color: var(--teal); min-height: 32px; margin-bottom: 24px; }
  .game-reveal-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--paper); font-family: 'Noto Sans Hebrew', sans-serif; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  .game-answer-row { display: flex; gap: 10px; margin-top: 6px; }
  .game-answer-row button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-family: 'Noto Sans Hebrew', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; }
  .know-big { background: var(--teal); color: #10231C; }
  .unknown-big { background: var(--seal); color: #2B0E0C; }
  .game-summary { font-size: 14px; line-height: 1.8; }
  .game-summary .big-num { font-family: 'Shippori Mincho', serif; font-size: 34px; }
  .game-done-btn { margin-top: 18px; width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--seal); color: #F6E9E7; font-weight: 700; font-family: 'Noto Sans Hebrew', sans-serif; cursor: pointer; }

  .footer-note { margin-top: 26px; text-align: center; font-size: 11px; color: var(--paper-dim); line-height: 1.7; }

  /* auth screen */
  .auth-wrap { max-width: 340px; margin: 60px auto 0; }
  .auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; }
  .auth-card h2 { font-family: 'Shippori Mincho', serif; font-size: 20px; margin: 0 0 18px; text-align: center; }
  .auth-field { margin-bottom: 12px; }
  .auth-field label { display: block; font-size: 12px; color: var(--paper-dim); margin-bottom: 5px; }
  .auth-field input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-raised); color: var(--paper); font-family: 'Noto Sans Hebrew', sans-serif; font-size: 14px;
  }
  .auth-field input:focus { outline: none; border-color: var(--teal); }
  .auth-btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .auth-btn-row button {
    flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans Hebrew', sans-serif; font-size: 14px;
  }
  .auth-signup { background: var(--teal); color: #10231C; }
  .auth-login { background: var(--surface-raised); color: var(--paper); border: 1px solid var(--line) !important; }
  .auth-error { color: var(--seal); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
  .logout-btn {
    background: none; border: 1px solid var(--line); color: var(--paper-dim); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans Hebrew', sans-serif;
  }
</style>
</head>

/* Firebase Auth needs an email format, so a username becomes username@kotoba-vocab.app internally */
function usernameToEmail(username) {
  const clean = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  return clean + '@kotoba-vocab.app';
}
function authErrorMessage(err) {
  const code = err && err.code;
  if (code === 'auth/email-already-in-use') return 'שם המשתמש הזה כבר תפוס — נסי שם אחר או התחברי.';
  if (code === 'auth/weak-password') return 'הסיסמה חייבת להכיל לפחות 6 תווים.';
  if (code === 'auth/invalid-email') return 'שם המשתמש מכיל תווים לא תקינים.';
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'שם משתמש או סיסמה שגויים.';
  if (code === 'auth/missing-password') return 'צריך למלא סיסמה.';
  return 'משהו השתבש (' + code + '). נסי שוב.';
}

/* ================= FLATTEN ================= */
const WORDS = [];
const CAT_INDEX = {}; // catId -> { subId -> [globalIndices] }
CATEGORIES.forEach(cat => {
  CAT_INDEX[cat.id] = {};
  cat.subs.forEach(sub => {
    const idxs = [];
    sub.words.forEach(w => { WORDS.push(w); idxs.push(WORDS.length - 1); });
    CAT_INDEX[cat.id][sub.id] = idxs;
  });
});
function catAllIndices(catId) {
  return Object.values(CAT_INDEX[catId]).flat();
}

/* ================= STATE / STORAGE ================= */
let progress = null; // { status: { idx: 'known'|'unknown' } }
let nav = { view: 'home', catId: null, subId: null };

async function loadProgress() {
  try {
    const snap = await getDoc(doc(db, 'vocabProgress', auth.currentUser.uid));
    return snap.exists() ? snap.data() : null;
  } catch (e) { console.error('load failed', e); return null; }
}
async function saveProgress(p) {
  try { await setDoc(doc(db, 'vocabProgress', auth.currentUser.uid), p); }
  catch (e) { console.error('save failed', e); }
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function countStatus(indices, status) {
  return indices.filter(i => progress.status[i] === status).length;
}
function globalUnknownIndices() {
  return Object.keys(progress.status).filter(k => progress.status[k] === 'unknown').map(Number);
}

/* ================= CARD RENDERING (shared) ================= */
function makeCard(idx) {
  const [en, ro] = WORDS[idx];
  const status = progress.status[idx];
  const div = document.createElement('div');
  div.className = 'card' + (status ? ' ' + status : '');
  div.innerHTML = `
    ${status ? `<div class="status-dot ${status}"></div>` : ''}
    <div class="front-en"><span class="ltr">${en}</span></div>
    <div class="back-ro"><span class="ltr">${ro}</span></div>
    <div class="mark-row">
      <button class="mark-btn know-btn ${status === 'known' ? 'active-know' : ''}" title="יודעת">✓</button>
      <button class="mark-btn unknown-btn ${status === 'unknown' ? 'active-unknown' : ''}" title="לא יודעת">✗</button>
    </div>
  `;
  div.addEventListener('click', (e) => {
    if (e.target.closest('.mark-btn')) return;
    div.classList.toggle('flipped');
  });
  div.querySelector('.know-btn').addEventListener('click', async () => {
    progress.status[idx] = 'known';
    await saveProgress(progress);
    render();
  });
  div.querySelector('.unknown-btn').addEventListener('click', async () => {
    progress.status[idx] = 'unknown';
    await saveProgress(progress);
    render();
  });
  return div;
}

/* ================= VIEWS ================= */
const app = document.getElementById('app');

function renderHome() {
  const unknownCount = globalUnknownIndices().length;
  let html = '';
  if (unknownCount > 0) {
    html += `<div class="stack-pill" id="stackPill"><span class="txt">🗂️ מילים שלא ידעתי</span><span class="count">${unknownCount}</span></div>`;
  }
  html += `<div class="cat-grid" id="catGrid"></div>`;
  app.innerHTML = html;

  if (unknownCount > 0) {
    document.getElementById('stackPill').addEventListener('click', () => {
      nav = { view: 'stack' };
      render();
    });
  }
  const grid = document.getElementById('catGrid');
  CATEGORIES.forEach(cat => {
    const all = catAllIndices(cat.id);
    const known = countStatus(all, 'known');
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `<div class="icon">${cat.icon}</div><div class="name">${cat.name}</div><div class="prog">${known}/${all.length} ידועות</div>`;
    card.addEventListener('click', () => { nav = { view: 'category', catId: cat.id }; render(); });
    grid.appendChild(card);
  });
}

function renderCategory(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  let html = `
    <div class="topnav">
      <button class="back-btn" id="backBtn">→ חזרה</button>
      <div><h1>${cat.icon} ${cat.name}</h1></div>
    </div>
    <div class="sub-list" id="subList"></div>
  `;
  app.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => { nav = { view: 'home' }; render(); });

  const list = document.getElementById('subList');
  cat.subs.forEach(sub => {
    const idxs = CAT_INDEX[cat.id][sub.id];
    const known = countStatus(idxs, 'known');
    const row = document.createElement('div');
    row.className = 'sub-row';
    row.innerHTML = `<div><div class="name">${sub.name}</div><div class="prog">${known}/${idxs.length} ידועות</div></div><div class="chev">‹</div>`;
    row.addEventListener('click', () => { nav = { view: 'subcategory', catId: cat.id, subId: sub.id }; render(); });
    list.appendChild(row);
  });
}

function renderSubcategory(catId, subId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  const sub = cat.subs.find(s => s.id === subId);
  const idxs = CAT_INDEX[catId][subId];

  app.innerHTML = `
    <div class="topnav">
      <button class="back-btn" id="backBtn">→ חזרה</button>
      <div><h1>${sub.name}</h1><div class="sub">${cat.name}</div></div>
    </div>
    <div class="grid" id="wordGrid"></div>
    <button class="game-btn" id="gameBtn">🎮 מצב משחק — הקבוצה הזו</button>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { nav = { view: 'category', catId }; render(); });

  const grid = document.getElementById('wordGrid');
  idxs.forEach(idx => grid.appendChild(makeCard(idx)));

  document.getElementById('gameBtn').addEventListener('click', () => openGame(idxs));
}

function renderStack() {
  const idxs = globalUnknownIndices();
  app.innerHTML = `
    <div class="topnav">
      <button class="back-btn" id="backBtn">→ חזרה</button>
      <div><h1>🗂️ מילים שלא ידעתי</h1><div class="sub">מכל הקטגוריות</div></div>
    </div>
    <div class="grid" id="wordGrid"></div>
    <button class="game-btn" id="gameBtn" ${idxs.length === 0 ? 'disabled' : ''}>🎮 מצב משחק — תרגול הערימה</button>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { nav = { view: 'home' }; render(); });

  const grid = document.getElementById('wordGrid');
  if (idxs.length === 0) {
    grid.innerHTML = '<div class="empty-note" style="grid-column: 1 / -1;">הערימה ריקה כרגע 🎉</div>';
  } else {
    shuffle(idxs).forEach(idx => grid.appendChild(makeCard(idx)));
  }
  document.getElementById('gameBtn').addEventListener('click', () => openGame(idxs));
}

function render() {
  document.getElementById('sealTotal').textContent = countKnownTotal();
  if (nav.view === 'home') renderHome();
  else if (nav.view === 'category') renderCategory(nav.catId);
  else if (nav.view === 'subcategory') renderSubcategory(nav.catId, nav.subId);
  else if (nav.view === 'stack') renderStack();
}
function countKnownTotal() {
  return Object.values(progress.status).filter(s => s === 'known').length;
}

/* ================= GAME MODE ================= */
let game = null;

function openGame(indices) {
  if (!indices.length) return;
  game = { queue: shuffle(indices), attempts: {}, total: indices.length, results: { known: 0, toStack: 0 } };
  document.getElementById('gameOverlay').classList.add('open');
  renderGameCard();
}
function closeGame() {
  document.getElementById('gameOverlay').classList.remove('open');
  game = null;
  render();
}
function renderGameCard() {
  const area = document.getElementById('gameCardArea');
  if (!game.queue.length) {
    area.innerHTML = `
      <button class="game-close" id="gameCloseBtn">✕</button>
      <div class="game-summary">
        <div class="big-num">🎉</div>
        סיימת את הסבב!<br>
        <b>${game.results.known}</b> סומנו כיודעת<br>
        <b>${game.results.toStack}</b> עברו לערימת "לא ידעתי"
      </div>
      <button class="game-done-btn" id="gameDoneBtn">סגירה</button>
    `;
    document.getElementById('gameCloseBtn').addEventListener('click', closeGame);
    document.getElementById('gameDoneBtn').addEventListener('click', closeGame);
    return;
  }
  const idx = game.queue[0];
  const [en, ro] = WORDS[idx];
  area.innerHTML = `
    <button class="game-close" id="gameCloseBtn">✕</button>
    <div class="game-progress">נשארו ${game.queue.length} בסבב הזה</div>
    <div class="game-word"><span class="ltr">${en}</span></div>
    <div class="game-reading ltr" id="gameReading" style="display:none;">${ro}</div>
    <button class="game-reveal-btn" id="revealBtn">הראי את התשובה</button>
    <div class="game-answer-row" id="answerRow" style="display:none;">
      <button class="know-big" id="knowBtn">✓ ידעתי</button>
      <button class="unknown-big" id="unknownBtn">✗ לא ידעתי</button>
    </div>
  `;
  document.getElementById('gameCloseBtn').addEventListener('click', closeGame);
  document.getElementById('revealBtn').addEventListener('click', () => {
    document.getElementById('gameReading').style.display = 'block';
    document.getElementById('revealBtn').style.display = 'none';
    document.getElementById('answerRow').style.display = 'flex';
  });
  document.getElementById('knowBtn').addEventListener('click', () => answerGame(true));
  document.getElementById('unknownBtn').addEventListener('click', () => answerGame(false));
}
async function answerGame(knewIt) {
  const idx = game.queue.shift();
  if (knewIt) {
    progress.status[idx] = 'known';
    game.results.known++;
    await saveProgress(progress);
  } else {
    game.attempts[idx] = (game.attempts[idx] || 0) + 1;
    if (game.attempts[idx] >= 3) {
      progress.status[idx] = 'unknown';
      game.results.toStack++;
      await saveProgress(progress);
    } else {
      const insertAt = Math.min(2, game.queue.length);
      game.queue.splice(insertAt, 0, idx);
    }
  }
  renderGameCard();
}

/* ================= AUTH SCREEN ================= */
let authMode = 'signup'; // 'signup' | 'login'

function renderAuthScreen() {
  document.getElementById('logoutBtn').style.display = 'none';
  const isSignup = authMode === 'signup';
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>言葉 Kotoba</h2>
        <h3 style="text-align:center; font-size:14px; color:var(--paper-dim); margin:-10px 0 18px;">
          ${isSignup ? 'יצירת חשבון חדש' : 'התחברות לחשבון קיים'}
        </h3>
        <div class="auth-field">
          <label>שם משתמש</label>
          <input type="text" id="authUsername" autocomplete="username">
        </div>
        <div class="auth-field">
          <label>סיסמה</label>
          <input type="password" id="authPassword" autocomplete="${isSignup ? 'new-password' : 'current-password'}">
        </div>
        <div class="auth-btn-row">
          <button class="${isSignup ? 'auth-signup' : 'auth-login'}" id="authSubmitBtn" style="flex:1;">
            ${isSignup ? 'הרשמה' : 'התחברות'}
          </button>
        </div>
        <div class="auth-error" id="authError"></div>
        <div style="text-align:center; margin-top:16px; font-size:13px;">
          ${isSignup ? 'כבר יש לך חשבון?' : 'אין לך חשבון עדיין?'}
          <a href="#" id="authSwitchLink" style="color:var(--teal); text-decoration:underline;">
            ${isSignup ? 'התחברות' : 'הרשמה'}
          </a>
        </div>
      </div>
    </div>
  `;
  const userEl = document.getElementById('authUsername');
  const passEl = document.getElementById('authPassword');
  const errEl = document.getElementById('authError');

  document.getElementById('authSubmitBtn').addEventListener('click', async () => {
    errEl.textContent = '';
    if (!userEl.value.trim() || !passEl.value) { errEl.textContent = 'צריך למלא שם משתמש וסיסמה.'; return; }
    try {
      if (isSignup) {
        await createUserWithEmailAndPassword(auth, usernameToEmail(userEl.value), passEl.value);
      } else {
        await signInWithEmailAndPassword(auth, usernameToEmail(userEl.value), passEl.value);
      }
    } catch (e) { errEl.textContent = authErrorMessage(e); }
  });

  document.getElementById('authSwitchLink').addEventListener('click', (e) => {
    e.preventDefault();
    authMode = isSignup ? 'login' : 'signup';
    renderAuthScreen();
  });
}

/* ================= INIT ================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    progress = null;
    renderAuthScreen();
    return;
  }
  document.getElementById('logoutBtn').style.display = 'inline-block';
  app.innerHTML = '<div class="empty-note">טוען...</div>';
  let p = await loadProgress();
  if (!p) { p = { status: {} }; await saveProgress(p); }
  progress = p;
  nav = { view: 'home' };
  render();
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

</script>
